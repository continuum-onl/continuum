name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect Frontend Directory
        id: detect-dir
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "FRONT_DIR=frontend" >> $GITHUB_ENV
            echo "ANDROID_DIR=frontend/android" >> $GITHUB_ENV
          else
            echo "FRONT_DIR=." >> $GITHUB_ENV
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
          fi

      - name: Install native image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvips-dev

      - name: Install dependencies and Capacitor
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm ci
          npm install --no-save \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/assets@3.0.5 \
            @capacitor/status-bar@8.0.3

      - name: Install dependencies and Build Web
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm run build

      - name: Prepare icon.png (icon source)
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          set -e

          echo "Searching for a favicon/logo across the whole project..."

          CANDIDATES=$(find . -type f \( -iname "favicon*.png" -o -iname "favicon*.svg" -o -iname "favicon*.ico" -o -iname "logo*.png" -o -iname "logo*.svg" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/android/*" \
            -not -path "*/ios/*" \
            -not -path "*/dist/*" \
            -not -path "*/assets/*" 2>/dev/null)

          echo "Candidates found:"
          echo "$CANDIDATES"

          SRC=$(echo "$CANDIDATES" | grep -iE '\.png$' | grep -iE '(^|/)public/' | head -n 1)

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATES" | grep -iE '\.png$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATES" | grep -iE '\.svg$' | grep -iE '(^|/)public/' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATES" | grep -iE '\.svg$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATES" | grep -iE '\.ico$' | grep -iE '(^|/)public/' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATES" | grep -iE '\.ico$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            echo "ERROR: no favicon/logo found anywhere in the repository."
            exit 1
          fi

          echo "Using as source: $SRC"

          sudo apt-get update -qq
          sudo apt-get install -y imagemagick file

          mkdir -p assets

          REAL_TYPE=$(file -b "$SRC")
          echo "Actual file type: $REAL_TYPE"

          if echo "$REAL_TYPE" | grep -qi "icon resource"; then
            echo "It's an ICO container. Converting to plain PNG..."
            convert "$SRC[0]" -resize 1024x1024 assets/icon.png

          elif echo "$REAL_TYPE" | grep -qi "^PNG image data"; then
            echo "It's a plain PNG, copying directly."
            cp "$SRC" assets/icon.png

          else
            echo "Format not recognized as plain PNG (probably SVG). Converting..."
            convert "$SRC" -resize 1024x1024 assets/icon.png
          fi

          echo "Final result:"
          file assets/icon.png

      - name: Initialize Android Project
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          cat > capacitor.config.ts << 'EOF'
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.continuumnodes.continuum',
            appName: 'Continuum',
            webDir: 'dist',
            plugins: {
              SystemBars: {
                insetsHandling: 'disable',
                style: 'DARK',
                hidden: false,
                animation: 'NONE',
              },
            },
          };

          export default config;
          EOF

          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android 15 edge-to-edge opt-out
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          mkdir -p app/src/main/res/values-v35
          cat > app/src/main/res/values-v35/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
          </resources>
          EOF

      - name: Set Android versionCode
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          while IFS= read -r -d '' GRADLE_FILE; do
            if grep -q "versionCode" "$GRADLE_FILE"; then
              sed -i -E "s/(versionCode[[:space:]]+)[0-9]+/\1${VERSION_CODE}/g" "$GRADLE_FILE"
              sed -i -E "s/(versionCode[[:space:]]*=[[:space:]]*)0/\1${VERSION_CODE}/g" "$GRADLE_FILE"
              sed -i -E "s/(versionCode[^:]*:[[:space:]]*)0/\1${VERSION_CODE}/g" "$GRADLE_FILE"
            fi
          done < <(find . -type f -name "*.gradle" -print0)

          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

          grep -RIn "versionCode" . --include="*.gradle"

      - name: Generate App Icons
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npx @capacitor/assets generate --android --assetPath assets

      - name: Fix Status Bar for Android 15+
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "Fixing Status Bar for Android 15/16+..."

          MAIN_ACTIVITY="app/src/main/java/com/continuumnodes/continuum/MainActivity.java"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            MAIN_ACTIVITY=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          fi

          if [ -z "$MAIN_ACTIVITY" ] || [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity found at: $MAIN_ACTIVITY"

          cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.continuumnodes.continuum;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.FrameLayout;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private View statusBarBackground;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                      if (android.os.Build.VERSION.SDK_INT >= 35) {
                        // Android 15+ may enforce edge-to-edge. Inset the WebView
                        // once using the platform-reported system bars.
                        WindowCompat.setDecorFitsSystemWindows(window, false);

                        View webView = getBridge().getWebView();
                        ViewGroup.MarginLayoutParams initialLayoutParams =
                          (ViewGroup.MarginLayoutParams) webView.getLayoutParams();
                        final int initialLeft = initialLayoutParams.leftMargin;
                        final int initialTop = initialLayoutParams.topMargin;
                        final int initialRight = initialLayoutParams.rightMargin;
                        final int initialBottom = initialLayoutParams.bottomMargin;
                        ViewCompat.setOnApplyWindowInsetsListener(
                            webView,
                            (view, insets) -> {
                              Insets systemBars = insets.getInsets(
                                  WindowInsetsCompat.Type.systemBars()
                              );
                              ViewGroup.MarginLayoutParams layoutParams =
                                (ViewGroup.MarginLayoutParams) view.getLayoutParams();
                              layoutParams.setMargins(
                                initialLeft + systemBars.left,
                                initialTop + systemBars.top,
                                initialRight + systemBars.right,
                                initialBottom + systemBars.bottom
                              );
                              view.setLayoutParams(layoutParams);
                              return insets;
                            }
                        );
                        ViewCompat.requestApplyInsets(webView);
                      } else {
                        // Android 14 and older use the platform's normal fit.
                        WindowCompat.setDecorFitsSystemWindows(window, true);
                      }

                  // The Status Bar becomes transparent.
                  // The View created below is responsible for the black background.
                  window.setStatusBarColor(Color.TRANSPARENT);

                  // Removes automatic contrast enforcement that can create a gray band.
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      window.setStatusBarContrastEnforced(false);
                  }

                  // Overall window background.
                  window.getDecorView().setBackgroundColor(Color.BLACK);

                  // White Status Bar icons/text.
                  WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(
                                  window,
                                  window.getDecorView()
                          );

                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                  }

                  // Android's main container.
                  ViewGroup decorView = (ViewGroup) window.getDecorView();

                  // Dedicated black View to cover EXACTLY the Status Bar area.
                  statusBarBackground = new View(this);
                  statusBarBackground.setBackgroundColor(Color.BLACK);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0
                          );

                  params.gravity = Gravity.TOP;

                  decorView.addView(statusBarBackground, params);

                  // Use WindowInsets to find the real Status Bar height.
                  ViewCompat.setOnApplyWindowInsetsListener(
                          decorView,
                          (view, insets) -> {

                              Insets statusBars =
                                      insets.getInsets(
                                              WindowInsetsCompat.Type.statusBars()
                                      );

                              ViewGroup.LayoutParams layoutParams =
                                      statusBarBackground.getLayoutParams();

                              layoutParams.width =
                                      ViewGroup.LayoutParams.MATCH_PARENT;

                              layoutParams.height = statusBars.top;

                              statusBarBackground.setLayoutParams(layoutParams);

                              statusBarBackground.setTranslationY(0);

                              return insets;
                          }
                  );

                  // Force the initial application of insets.
                  ViewCompat.requestApplyInsets(decorView);
              }
          }
          EOF

          echo "Status Bar fixed."

      - name: Set versionName/versionCode from tag
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          RAW="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* && "$RAW" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
            VERSION_NAME="$MAJOR.$MINOR.$PATCH"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "Semver tag detected: versionName=$VERSION_NAME versionCode=$VERSION_CODE"
            sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
            sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" app/build.gradle
          else
            echo "Not a semver tag (ref=${{ github.ref }}) — keeping the versionCode already set by the previous step (${ANDROID_VERSION_CODE:-1})."
          fi
          grep -n "version" app/build.gradle

      - name: APK install native plugin
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          PKG_DIR="app/src/main/java/com/continuumnodes/continuum"
          mkdir -p "$PKG_DIR"

          cat > "$PKG_DIR/ApkInstallerPlugin.java" << 'EOF'
          package com.continuumnodes.continuum;

          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {

              @PluginMethod
              public void getAppInfo(PluginCall call) {
                  try {
                      PackageInfo info = getContext()
                              .getPackageManager()
                              .getPackageInfo(getContext().getPackageName(), 0);

                      long code = Build.VERSION.SDK_INT >= 28
                              ? info.getLongVersionCode()
                              : info.versionCode;

                      JSObject result = new JSObject();
                      result.put("versionName", info.versionName);
                      result.put("versionCode", code);
                      result.put("packageName", info.packageName);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Could not read package info", e);
                  }
              }

              @PluginMethod
              public void canRequestInstall(PluginCall call) {
                  boolean granted = true;
                  if (Build.VERSION.SDK_INT >= 26) {
                      granted = getContext().getPackageManager().canRequestPackageInstalls();
                  }
                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      Intent intent = new Intent(
                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName())
                      );
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void downloadAndInstall(final PluginCall call) {
                  final String url = call.getString("url");
                  final String fileName = call.getString("fileName", "update.apk");

                  if (url == null || !url.startsWith("https://")) {
                      call.reject("Invalid download URL");
                      return;
                  }

                  JSObject started = new JSObject();
                  started.put("started", true);
                  call.resolve(started);

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          HttpURLConnection connection = null;
                          try {
                              File dir = new File(getContext().getExternalFilesDir(null), "apk");
                              if (!dir.exists()) dir.mkdirs();
                              File target = new File(dir, fileName);
                              if (target.exists()) target.delete();

                              connection = (HttpURLConnection) new URL(url).openConnection();
                              connection.setInstanceFollowRedirects(true);
                              connection.setConnectTimeout(30000);
                              connection.setReadTimeout(60000);
                              connection.connect();

                              int total = connection.getContentLength();
                              InputStream input = connection.getInputStream();
                              FileOutputStream output = new FileOutputStream(target);

                              byte[] buffer = new byte[8192];
                              long downloaded = 0;
                              int read;
                              int lastPercent = -1;

                              while ((read = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, read);
                                  downloaded += read;

                                  int percent = total > 0 ? (int) (downloaded * 100 / total) : 0;
                                  if (percent != lastPercent) {
                                      lastPercent = percent;
                                      JSObject progress = new JSObject();
                                      progress.put("percent", percent);
                                      progress.put("downloadedBytes", downloaded);
                                      progress.put("totalBytes", total);
                                      notifyListeners("apkDownloadProgress", progress);
                                  }
                              }

                              output.flush();
                              output.close();
                              input.close();

                              Uri uri = FileProvider.getUriForFile(
                                      getContext(),
                                      getContext().getPackageName() + ".fileprovider",
                                      target
                              );

                              Intent intent = new Intent(Intent.ACTION_VIEW);
                              intent.setDataAndType(uri, "application/vnd.android.package-archive");
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              getContext().startActivity(intent);
                          } catch (Exception e) {
                              JSObject failure = new JSObject();
                              failure.put("percent", -1);
                              failure.put("downloadedBytes", 0);
                              failure.put("totalBytes", 0);
                              notifyListeners("apkDownloadProgress", failure);
                          } finally {
                              if (connection != null) connection.disconnect();
                          }
                      }
                  }).start();
              }
          }
          EOF

          MAIN_ACTIVITY=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(ApkInstallerPlugin.class);\n        super.onCreate(savedInstanceState);/' "$MAIN_ACTIVITY"
          grep -n "registerPlugin" "$MAIN_ACTIVITY"

          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application#' "$MANIFEST"
          fi
          grep -n "uses-permission" "$MANIFEST"

          FILE_PATHS="app/src/main/res/xml/file_paths.xml"
          if [ -f "$FILE_PATHS" ] && ! grep -q "apk_updates" "$FILE_PATHS"; then
            sed -i 's#</paths>#    <external-files-path name="apk_updates" path="apk/" />\n</paths>#' "$FILE_PATHS"
          fi
          cat "$FILE_PATHS" || true


      - name: Configure Google OAuth App Link
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:autoVerify="true"' "$MANIFEST"; then
            sed -i '/MainActivity/,/<\/activity>/s#</activity>#        <intent-filter android:autoVerify="true">\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data\n                android:scheme="https"\n                android:host="continuum.onl"\n                android:pathPrefix="/google-callback" />\n        </intent-filter>\n    </activity>#' "$MANIFEST"
          fi
          grep -n -A 8 'android:autoVerify="true"' "$MANIFEST"
          if ! grep -q 'android:scheme="continuum"' "$MANIFEST"; then
            sed -i '/MainActivity/,/<\/activity>/s#</activity>#        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="continuum" android:host="google-callback" />\n        </intent-filter>\n    </activity>#' "$MANIFEST"
          fi
          grep -n -B 3 -A 2 'android:scheme="continuum"' "$MANIFEST"

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant Gradle execute permission
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew -PversionCode="${ANDROID_VERSION_CODE:-1}" assembleRelease

      - name: Decode and Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > keystore.jks

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$ALIAS_PASSWORD" \
            --out ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          keytool -list -v -keystore keystore.jks -alias "$KEY_ALIAS" -storepass "$KEY_STORE_PASSWORD" | grep 'SHA256:'

          rm keystore.jks

      - name: Upload APK (always, regardless of tag)
        uses: actions/upload-artifact@v4
        with:
          name: continuum-release-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          retention-days: 14

      - name: Set tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and attach Signed APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          draft: false
          prerelease: false